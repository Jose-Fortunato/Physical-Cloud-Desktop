directories:
  output: dist
  buildResources: build
appId: com.physicalcloud.app
productName: Physical Cloud
icon: assets/icon
files:
  - filter:
      - main.js
      - preload.js
      - src/**/*
      - assets/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/icon.icns
  category: public.app-category.utilities
linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: assets/icon.png
  category: Network
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
dmg:
  contents:
    - x: 410
      'y': 150
      type: link
      path: /Applications
    - x: 130
      'y': 150
      type: file
electronVersion: 28.3.3
